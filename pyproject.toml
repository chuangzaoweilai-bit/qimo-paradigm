[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qimo-structured-model"
version = "0.2.0"
description = "A Qimo-native origin-terminal runtime, training pipeline, and benchmark."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
